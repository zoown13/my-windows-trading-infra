AWSTemplateFormatVersion: '2010-09-09'
Description: Windows trading infrastructure with secure remote access options and baseline monitoring.

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair used to decrypt the initial Administrator password.

  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues:
      - t3.small
      - t3.medium
      - t3.large
    Description: Windows instance type.

  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Availability Zone for the public subnet (for example ap-northeast-2a).

  AllowedRdpIp:
    Type: String
    Default: 203.0.113.10/32
    Description: Operator public IPv4 CIDR allowed for direct RDP when enabled.
    AllowedPattern: ^(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})(?:\.(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})){3}\/(?:3[0-2]|[12]?[0-9])$
    ConstraintDescription: Enter a valid IPv4 CIDR format, such as 203.0.113.10/32.

  UseDirectRdp:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Set true only for temporary direct RDP access.

  LatestWindowsAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-windows-latest/Windows_Server-2022-Korean-Full-Base
    Description: SSM path for latest Windows Server 2022 Korean Full Base AMI.

  RootVolumeSize:
    Type: Number
    Default: 100
    MinValue: 50
    Description: Root EBS volume size in GiB.

  DisableApiTermination:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Termination protection for accidental deletion prevention.

  AlarmNotificationTopicArn:
    Type: String
    Description: SNS Topic ARN for CloudWatch alarms.

  ServiceName:
    Type: String
    Default: magic-split
    Description: Service tag value.

  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - stage
      - prod
    Description: Environment tag value.

  Owner:
    Type: String
    Default: trading-team
    Description: Owner tag value.

Conditions:
  EnableDirectRdp: !Equals [!Ref UseDirectRdp, 'true']
  EnableTerminationProtection: !Equals [!Ref DisableApiTermination, 'true']

Resources:
  TradingVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ServiceName}-${Environment}-vpc'
        - Key: Service
          Value: !Ref ServiceName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner

  TradingIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ServiceName}-${Environment}-igw'

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref TradingVPC
      InternetGatewayId: !Ref TradingIGW

  TradingPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TradingVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ServiceName}-${Environment}-public-subnet'

  TradingRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref TradingVPC
      Tags:
        - Key: Name
          Value: !Sub '${ServiceName}-${Environment}-rtb'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref TradingRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref TradingIGW

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref TradingRouteTable
      SubnetId: !Ref TradingPublicSubnet

  WindowsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Windows trading instance.
      VpcId: !Ref TradingVPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ServiceName}-${Environment}-windows-sg'

  WindowsSecurityGroupRdpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: EnableDirectRdp
    Properties:
      GroupId: !Ref WindowsSecurityGroup
      IpProtocol: tcp
      FromPort: 3389
      ToPort: 3389
      CidrIp: !Ref AllowedRdpIp
      Description: Temporary direct RDP ingress.

  WindowsInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy

  WindowsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref WindowsInstanceRole

  TradingWindowsInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestWindowsAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref TradingPublicSubnet
      SecurityGroupIds:
        - !Ref WindowsSecurityGroup
      IamInstanceProfile: !Ref WindowsInstanceProfile
      DisableApiTermination: !If [EnableTerminationProtection, true, false]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            Encrypted: true
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSize
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          <powershell>
          Set-TimeZone -Id "Korea Standard Time"
          </powershell>
      Tags:
        - Key: Name
          Value: !Sub '${ServiceName}-${Environment}-windows-trading'
        - Key: Service
          Value: !Ref ServiceName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner

  HighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Alarm when EC2 CPU utilization is consistently high.
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceId
          Value: !Ref TradingWindowsInstance
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopicArn
      OKActions:
        - !Ref AlarmNotificationTopicArn

  StatusCheckFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Alarm when EC2 status check fails.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref TradingWindowsInstance
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlarmNotificationTopicArn
      OKActions:
        - !Ref AlarmNotificationTopicArn

Outputs:
  InstanceId:
    Description: EC2 instance ID.
    Value: !Ref TradingWindowsInstance

  InstancePublicIp:
    Description: Public IP of the Windows EC2 instance.
    Value: !GetAtt TradingWindowsInstance.PublicIp

  DirectRdpEnabled:
    Description: Whether direct RDP ingress is enabled.
    Value: !Ref UseDirectRdp
